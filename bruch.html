<script>
/* ============================================================
   KaTeX-Global-Render-Funktion: Wandelt ALLE $...$ im HTML um
   ============================================================ */
function renderAlleFormeln(element) {
  if (typeof katex === 'undefined' || !katex || !element) return;
  // Nur explizit mit $...$ markierte Formeln rendern.
  // Bereits gerenderte KaTeX-Ausgaben enthalten keine solchen äußeren Marker.
  element.innerHTML = element.innerHTML.replace(/\$(.+?)\$/g, function (match, tex) {
    try {
      return katex.renderToString(tex, { displayMode: false, throwOnError: false });
    } catch (e) {
      return match;
    }
  });
}

// In Hinweisen stehen kurze LaTeX-Ausdrücke neben normalem Text.
// Diese werden markiert, damit dieselbe Renderfunktion sie zuverlässig erkennt.
function hinweisMitFormeln(text) {
  return String(text || '').replace(/\\frac\{[^{}]*\}\{[^{}]*\}|\\(?:rightarrow|left|right|cdot|times)\b/g, function (m) {
    return '$' + m + '$';
  });
}

/* ============================================================
   Bruch-Engine
   ============================================================ */
function ggT(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { var t = b; b = a % b; a = t; } return a; }
function kgV(a, b) { return (a * b) / ggT(a, b); }

var THEMEN = [
  { id: "add", name: "Brüche addieren" },
  { id: "sub", name: "Brüche subtrahieren" },
  { id: "mul", name: "Brüche multiplizieren" },
  { id: "div", name: "Brüche dividieren" },
  { id: "gemischt", name: "Gemischte Aufgaben" }
];
var TIDS = THEMEN.map(function (t) { return t.id; });
var SPEICHER_KEY = "bruchrechen-trainer";

function rnd(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

function dezimalAlsBruchTex(wert) {
  // Näherungsweise in einen kleinen Bruch umwandeln, damit auch
  // Ersatz-Distraktoren nicht als Dezimalzahlen auffallen.
  if (!Number.isFinite(wert)) return String(wert);
  var ganz = Math.round(wert);
  if (Math.abs(wert - ganz) < 0.0005) return String(ganz);

  var besterZ = Math.round(wert), besterN = 1, besterFehler = Math.abs(wert - besterZ);
  for (var n = 2; n <= 1000; n++) {
    var z = Math.round(wert * n);
    var fehler = Math.abs(wert - z / n);
    if (fehler < besterFehler) {
      besterFehler = fehler; besterZ = z; besterN = n;
      if (fehler < 0.00005) break;
    }
  }
  var g = ggT(besterZ, besterN);
  besterZ /= g; besterN /= g;
  return besterN === 1 ? String(besterZ) : '\\frac{' + besterZ + '}{' + besterN + '}';
}

function erzeugeDistraktoren(antwort, prim) {
  var uniq = [];
  prim.forEach(function(f) { if (Math.abs(f - antwort) > 0.001 && uniq.indexOf(f) === -1 && f >= 0) uniq.push(f); });
  var fallbacks = [antwort + 1, antwort - 1, antwort + 2, antwort - 2, antwort + 0.5, antwort - 0.5];
  for (var i = 0; i < fallbacks.length && uniq.length < 3; i++) { var v = parseFloat(fallbacks[i].toFixed(4)); if (Math.abs(v - antwort) > 0.001 && uniq.indexOf(v) === -1 && v >= 0) uniq.push(v); }
  for (var delta = 0.25; uniq.length < 3 && delta < 10; delta += 0.25) { [antwort + delta, antwort - delta].forEach(function(v) { v = parseFloat(v.toFixed(4)); if (uniq.length < 3 && Math.abs(v - antwort) > 0.001 && uniq.indexOf(v) === -1 && v >= 0) uniq.push(v); }); }
  return uniq.slice(0, 3);
}

function makeBruchAufgabe(themaId, diff) {
  var d = Math.max(1, Math.min(5, diff));
  var z1, n1, z2, n2, ergZ, ergN, frageTex, antwort, prim = [], hinweis = "";
  var gekuerzt = d >= 4;
  function bruchTex(z, n) { return "\\frac{" + z + "}{" + n + "}"; }

  if (themaId === "add") {
    if (d === 1) { n1 = rnd(2, 6); z1 = rnd(1, n1 - 1); z2 = rnd(1, n1 - 1); frageTex = bruchTex(z1, n1) + " + " + bruchTex(z2, n1); ergZ = z1 + z2; ergN = n1; hinweis = "Gleicher Nenner (" + n1 + "), Zähler addieren: " + z1 + " + " + z2 + " = " + ergZ; }
    else if (d === 2) { n1 = rnd(2, 5); n2 = n1 * rnd(2, 3); z1 = rnd(1, n1 - 1); z2 = rnd(1, n2 - 1); frageTex = bruchTex(z1, n1) + " + " + bruchTex(z2, n2); var faktor = n2 / n1; ergZ = z1 * faktor + z2; ergN = n2; hinweis = "Erweitere " + bruchTex(z1, n1) + " mit " + faktor + " \\rightarrow " + bruchTex(z1 * faktor, n2) + ", dann addieren"; }
    else if (d <= 4) { n1 = rnd(2, 6); n2 = rnd(3, 8); while (n2 === n1 || n2 % n1 === 0 || n1 % n2 === 0) n2 = rnd(3, 8); z1 = rnd(1, n1 - 1); z2 = rnd(1, n2 - 1); frageTex = bruchTex(z1, n1) + " + " + bruchTex(z2, n2); var g = kgV(n1, n2); var f1 = g / n1, f2 = g / n2; ergZ = z1 * f1 + z2 * f2; ergN = g; hinweis = "Hauptnenner: kgV(" + n1 + "," + n2 + ") = " + g; }
    else { n1 = rnd(2, 5); n2 = rnd(2, 5); var n3 = rnd(2, 5); z1 = rnd(1, n1 - 1); z2 = rnd(1, n2 - 1); var z3 = rnd(1, n3 - 1); frageTex = bruchTex(z1, n1) + " + " + bruchTex(z2, n2) + " + " + bruchTex(z3, n3); var g3 = kgV(kgV(n1, n2), n3); ergZ = z1 * (g3/n1) + z2 * (g3/n2) + z3 * (g3/n3); ergN = g3; hinweis = "Drei Brüche \\rightarrow gemeinsamer Nenner " + g3; }
  } else if (themaId === "sub") {
    if (d === 1) { n1 = rnd(2, 6); z1 = rnd(2, n1); z2 = rnd(1, z1 - 1); frageTex = bruchTex(z1, n1) + " - " + bruchTex(z2, n1); ergZ = z1 - z2; ergN = n1; hinweis = "Gleicher Nenner, Zähler subtrahieren"; }
    else if (d === 2) { n1 = rnd(2, 5); n2 = n1 * rnd(2, 3); z1 = rnd(2, n1); z2 = rnd(1, n2 - 1); while (z1 * (n2/n1) <= z2) { z1 = rnd(2, n1); z2 = rnd(1, n2 - 1); } frageTex = bruchTex(z1, n1) + " - " + bruchTex(z2, n2); var faktor2 = n2 / n1; ergZ = z1 * faktor2 - z2; ergN = n2; hinweis = "Erweitere " + bruchTex(z1, n1) + " mit " + faktor2; }
    else if (d <= 4) { n1 = rnd(2, 6); n2 = rnd(3, 8); while (n2 === n1 || n2 % n1 === 0 || n1 % n2 === 0) n2 = rnd(3, 8); z1 = rnd(2, n1); z2 = rnd(1, n2 - 1); var g2 = kgV(n1, n2); var f1b = g2 / n1, f2b = g2 / n2; while (z1 * f1b <= z2 * f2b) { z1 = rnd(2, n1); z2 = rnd(1, n2 - 1); } frageTex = bruchTex(z1, n1) + " - " + bruchTex(z2, n2); ergZ = z1 * f1b - z2 * f2b; ergN = g2; hinweis = "Hauptnenner: " + g2; }
    else { n1 = rnd(3, 7); n2 = rnd(2, 5); z1 = rnd(n1 + 1, 2 * n1); z2 = rnd(1, n2 - 1); frageTex = bruchTex(z1, n1) + " - " + bruchTex(z2, n2); var g4 = kgV(n1, n2); ergZ = z1 * (g4/n1) - z2 * (g4/n2); ergN = g4; hinweis = "Gemischte Nenner \\rightarrow Hauptnenner " + g4; }
  } else if (themaId === "mul") {
    if (d === 1) { z1 = rnd(1, 5); n1 = rnd(2, 6); z2 = rnd(1, 5); n2 = rnd(2, 6); frageTex = bruchTex(z1, n1) + " \\cdot " + bruchTex(z2, n2); ergZ = z1 * z2; ergN = n1 * n2; hinweis = "Zähler \\times Zähler, Nenner \\times Nenner"; }
    else if (d === 2) { var ganze = rnd(2, 5); z2 = rnd(1, 5); n2 = rnd(2, 6); frageTex = ganze + " \\cdot " + bruchTex(z2, n2); ergZ = ganze * z2; ergN = n2; hinweis = "Ganze Zahl als Bruch: " + ganze + " = " + bruchTex(ganze, 1); }
    else if (d <= 4) { z1 = rnd(2, 7); n1 = rnd(3, 8); z2 = rnd(2, 7); n2 = rnd(3, 8); frageTex = bruchTex(z1, n1) + " \\cdot " + bruchTex(z2, n2); ergZ = z1 * z2; ergN = n1 * n2; var t = ggT(ergZ, ergN); if (t > 1) hinweis = "Kürze mit " + t + ": " + bruchTex(ergZ/t, ergN/t); else hinweis = "Zähler \\times Zähler, Nenner \\times Nenner"; }
    else { z1 = rnd(1, 4); n1 = rnd(2, 5); z2 = rnd(1, 4); n2 = rnd(2, 5); var z3 = rnd(1, 4), n3 = rnd(2, 5); frageTex = bruchTex(z1, n1) + " \\cdot " + bruchTex(z2, n2) + " \\cdot " + bruchTex(z3, n3); ergZ = z1 * z2 * z3; ergN = n1 * n2 * n3; var t2 = ggT(ergZ, ergN); if (t2 > 1) hinweis = "Kürze mit " + t2; else hinweis = "Alle Zähler und Nenner multiplizieren"; }
  } else if (themaId === "div") {
    if (d === 1) { z1 = rnd(1, 5); n1 = rnd(2, 6); z2 = rnd(1, 5); n2 = rnd(2, 6); frageTex = bruchTex(z1, n1) + " : " + bruchTex(z2, n2); ergZ = z1 * n2; ergN = n1 * z2; hinweis = "Mit dem Kehrwert multiplizieren: " + bruchTex(z1, n1) + " \\cdot " + bruchTex(n2, z2); }
    else if (d === 2) { var ganze2 = rnd(2, 5); z2 = rnd(1, 4); n2 = rnd(2, 5); frageTex = ganze2 + " : " + bruchTex(z2, n2); ergZ = ganze2 * n2; ergN = z2; hinweis = ganze2 + " : " + bruchTex(z2, n2) + " = " + ganze2 + " \\cdot " + bruchTex(n2, z2); }
    else if (d <= 4) { z1 = rnd(2, 6); n1 = rnd(3, 7); z2 = rnd(2, 6); n2 = rnd(3, 7); frageTex = bruchTex(z1, n1) + " : " + bruchTex(z2, n2); ergZ = z1 * n2; ergN = n1 * z2; var t3 = ggT(ergZ, ergN); if (t3 > 1) hinweis = "Kehrwert, kürze mit " + t3; else hinweis = "Kehrwert: " + bruchTex(z1, n1) + " \\cdot " + bruchTex(n2, z2); }
    else { var a = rnd(1, 4), b = rnd(2, 5), c = rnd(1, 4), d2 = rnd(2, 5); frageTex = "\\frac{" + bruchTex(a, b) + "}{" + bruchTex(c, d2) + "}"; ergZ = a * d2; ergN = b * c; hinweis = "Doppelbruch: " + bruchTex(a, b) + " : " + bruchTex(c, d2); }
  } else {

function initEngine() { var s = { skills: {}, diffs: {}, streaksWin: {}, lastSeen: {}, runde: 0, historie: [] }; TIDS.forEach(function (id) { s.skills[id] = 0.5; s.diffs[id] = 1; s.streaksWin[id] = 0; s.lastSeen[id] = 0; }); return s; }

  var gewichte = THEMEN.map(function (t) {
    var skill = Math.max(0, Math.min(1, Number(e.skills[t.id]) || 0));
    var zuletzt = Number(e.lastSeen[t.id]) || 0;
    var pause = Math.max(0, Math.min(5, e.runde - zuletzt));
    return { id: t.id, gewicht: 1 + (1 - skill) * 2 + pause * 0.18 };
  });
  var summe = gewichte.reduce(function (s, x) { return s + x.gewicht; }, 0);
  var ziehung = Math.random() * summe;
  for (var i = 0; i < gewichte.length; i++) {
    ziehung -= gewichte[i].gewicht;

  var delta = richtig ? (dauerSek < 12 ? 0.06 : 0.04) : -0.10;
  e.skills[themaId] = Math.max(0, Math.min(1, e.skills[themaId] + delta));
  e.streaksWin[themaId] = richtig ? (e.streaksWin[themaId] || 0) + 1 : 0;
