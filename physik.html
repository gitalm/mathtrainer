<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f1f5f9; padding: 16px; }

  .eingabe { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

  .eingabe input:focus { outline: none; border-color: #38bdf8; }

  @media (max-width: 640px) { .skills { grid-template-columns: repeat(3, 1fr); gap: 4px; } .panel-body { grid-template-columns: 1fr; } }

<script>
/* ============================================================
   KaTeX-Hilfsfunktion
   ============================================================ */
function renderMath(tex) {
  if (typeof katex !== 'undefined' && katex) {
    try { return katex.renderToString(tex, { displayMode: false, throwOnError: false }); } catch(e) { return tex; }
  }
  return tex;
}

/* ============================================================
   Physik-Engine Q11 – IQB-Formeln
   ============================================================ */
var THEMEN = [
  { id: "kinematik", name: "Kinematik" },
  { id: "dreh", name: "Drehbewegungen" },
  { id: "zentri", name: "Zentripetalbeschl." }
];
var TIDS = THEMEN.map(function (t) { return t.id; });
var SPEICHER_KEY = "physik-trainer-q11-v3";

function rnd(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function rndDec(min, max, dec) { var f = Math.pow(10, dec); return Math.round((Math.random() * (max - min) + min) * f) / f; }

function erzeugeDistraktoren(antwort, prim) {
  var uniq = [];
  prim.forEach(function(f) { if (Math.abs(f - antwort) > 0.001 && uniq.indexOf(f) === -1) uniq.push(f); });
  var fallbacks = [antwort + 1, antwort - 1, antwort + 2, antwort - 2, antwort * 2, antwort / 2];
  for (var i = 0; i < fallbacks.length && uniq.length < 3; i++) { var v = parseFloat(fallbacks[i].toFixed(2)); if (Math.abs(v - antwort) > 0.001 && uniq.indexOf(v) === -1) uniq.push(v); }
  for (var delta = 0.5; uniq.length < 3 && delta < 30; delta += 0.5) { [antwort + delta, antwort - delta].forEach(function(v) { v = parseFloat(v.toFixed(2)); if (uniq.length < 3 && Math.abs(v - antwort) > 0.001 && uniq.indexOf(v) === -1) uniq.push(v); }); }
  return uniq.slice(0, 3);
}

function makeAufgabe(themaId, diff) {
  var d = Math.max(1, Math.min(5, diff));
  var frage, antwort, prim = [], hinweis = "", formelAnzeige = "";
  var v, t, s, a, r, omega, fHz, T, a_z, phi, m;

  if (themaId === "kinematik") {
    // IQB-Formeln: v = s/t, a = v/t, s = ½·a·t², v² = 2·a·s, v = √(2·g·h)
    if (d === 1) {
      v = rnd(5, 25); t = rnd(2, 10);
      formelAnzeige = "v = \\frac{s}{t}";
      frage = "Ein Auto fährt $" + v + "\\,\\frac{\\text{m}}{\\text{s}}$ konstant. Welche Strecke legt es in $" + t + "\\,\\text{s}$ zurück?";
      antwort = v * t;
      prim = [v + t, v * t + 10, v * t * 2];
      hinweis = "s = v \\cdot t = " + v + " \\cdot " + t + " = " + antwort + "\\,\\text{m}";
    } else if (d === 2) {
      a = rnd(2, 6); t = rnd(2, 5);
      formelAnzeige = "a = \\frac{v}{t} \\;\\Rightarrow\\; v = a \\cdot t";
      frage = "Ein Körper startet aus der Ruhe mit $" + a + "\\,\\frac{\\text{m}}{\\text{s}^2}$.\nWelche Geschwindigkeit hat er nach $" + t + "\\,\\text{s}$?";
      antwort = a * t;
      prim = [a * t * t, a + t, a * t + 2];
      hinweis = "v = a \\cdot t = " + a + " \\cdot " + t + " = " + antwort + "\\,\\frac{\\text{m}}{\\text{s}}";
    } else if (d === 3) {
      a = rnd(2, 5); t = rnd(3, 6);
      formelAnzeige = "s = \\frac{1}{2} \\cdot a \\cdot t^2";
      frage = "Aus der Ruhe beschleunigt ein Objekt mit $" + a + "\\,\\frac{\\text{m}}{\\text{s}^2}$.\nWelche Strecke legt es in den ersten $" + t + "\\,\\text{s}$ zurück?";
      antwort = 0.5 * a * t * t;
      prim = [a * t * t, 0.5 * a * t, a * t * t * 2];
      hinweis = "s = \\frac{1}{2} \\cdot " + a + " \\cdot " + t + "^2 = \\frac{1}{2} \\cdot " + a + " \\cdot " + (t*t) + " = " + antwort + "\\,\\text{m}";
    } else if (d === 4) {
      v = rnd(10, 30); t = rnd(2, 6);
      formelAnzeige = "a = \\frac{v}{t}";
      frage = "Ein Objekt erreicht $" + v + "\\,\\frac{\\text{m}}{\\text{s}}$ nach $" + t + "\\,\\text{s}$ aus der Ruhe.\nWie groß ist die Beschleunigung a?";
      antwort = parseFloat((v / t).toFixed(2));
      prim = [parseFloat((v * t).toFixed(2)), parseFloat((v - t).toFixed(2)), parseFloat((t / v).toFixed(2))];
      hinweis = "a = \\frac{" + v + "}{" + t + "} = " + antwort + "\\,\\frac{\\text{m}}{\\text{s}^2}";
    } else {
      var hoehe = rnd(10, 50);
      var g = 9.81;
      formelAnzeige = "v = \\sqrt{2 \\cdot g \\cdot h}";
      frage = "Freier Fall aus $" + hoehe + "\\,\\text{m}$ Höhe $(g = 9,81\\,\\frac{\\text{m}}{\\text{s}^2})$.\nMit welcher Geschwindigkeit trifft der Körper auf?";
      antwort = parseFloat(Math.sqrt(2 * g * hoehe).toFixed(1));
      prim = [parseFloat((g * hoehe).toFixed(1)), parseFloat((2 * g * hoehe).toFixed(1)), parseFloat((Math.sqrt(2 * hoehe / g)).toFixed(1))];
      hinweis = "v = \\sqrt{2 \\cdot 9,81 \\cdot " + hoehe + "} = \\sqrt{" + (2*9.81*hoehe).toFixed(1) + "} = " + antwort + "\\,\\frac{\\text{m}}{\\text{s}}";
    }
  } else if (themaId === "dreh") {
    // IQB-Formeln: ω = φ/t, v = ω·r, α = Δω/Δt, T = 1/f, f = 1/T
    if (d === 1) {
      var phiZahl = rnd(2, 8); t = rnd(2, 5);
      formelAnzeige = "\\omega = \\frac{\\varphi}{t}";
      frage = "Ein Rad überstreicht einen Winkel von $" + phiZahl + "\\pi\\,\\text{rad}$ in $" + t + "\\,\\text{s}$.\nWie groß ist $" + "\\omega$?";
      antwort = parseFloat((phiZahl * Math.PI / t).toFixed(2));
      prim = [parseFloat((phiZahl * Math.PI * t).toFixed(2)), parseFloat((t / phiZahl).toFixed(2)), parseFloat(((phiZahl * Math.PI) / (t * 2)).toFixed(2))];
      hinweis = "\\omega = \\frac{" + phiZahl + "\\pi}{" + t + "} = " + antwort + "\\,\\frac{\\text{rad}}{\\text{s}}";
    } else if (d === 2) {
      omega = rnd(3, 12); r = rndDec(0.5, 2.5, 1);
      formelAnzeige = "v = \\omega \\cdot r";
      frage = "Ein Punkt auf $" + r + "\\,\\text{m}$ Radius rotiert mit $" + omega + "\\,\\frac{\\text{rad}}{\\text{s}}$.\nBahngeschwindigkeit v?";
      antwort = parseFloat((omega * r).toFixed(2));
      prim = [parseFloat((omega / r).toFixed(2)), parseFloat((omega + r).toFixed(2)), parseFloat((2 * omega * r).toFixed(2))];
      hinweis = "v = " + omega + " \\cdot " + r + " = " + antwort + "\\,\\frac{\\text{m}}{\\text{s}}";
    } else if (d === 3) {
      v = rnd(5, 20); r = rndDec(0.5, 2.5, 1);
      formelAnzeige = "v = \\omega \\cdot r \\;\\Rightarrow\\; \\omega = \\frac{v}{r}";
      frage = "Ein Punkt hat $" + v + "\\,\\frac{\\text{m}}{\\text{s}}$ bei $" + r + "\\,\\text{m}$ Radius.\nWie groß ist $" + "\\omega$?";
      antwort = parseFloat((v / r).toFixed(2));
      prim = [parseFloat((v * r).toFixed(2)), parseFloat((v - r).toFixed(2)), parseFloat((r / v).toFixed(2))];
      hinweis = "\\omega = \\frac{" + v + "}{" + r + "} = " + antwort + "\\,\\frac{\\text{rad}}{\\text{s}}";
    } else if (d === 4) {
      var w1 = rnd(3, 8), w2 = rnd(10, 20), dt = rnd(2, 5);
      formelAnzeige = "\\alpha = \\frac{\\Delta \\omega}{\\Delta t}";
      frage = "Ein Rad beschleunigt von $" + "\\omega_1 = " + w1 + "\\,\\frac{\\text{rad}}{\\text{s}}$ auf $" + "\\omega_2 = " + w2 + "\\,\\frac{\\text{rad}}{\\text{s}}$ in $" + "\\Delta t = " + dt + "\\,\\text{s}$.\nWinkelbeschleunigung $" + "\\alpha$?";
      antwort = parseFloat(((w2 - w1) / dt).toFixed(2));
      prim = [parseFloat((w2 - w1) * dt).toFixed(2), parseFloat((w2 + w1) / dt).toFixed(2), parseFloat((w2 - w1) / (dt * dt)).toFixed(2)];
      prim = prim.map(function(p) { return parseFloat(p); });
      hinweis = "\\alpha = \\frac{" + w2 + " - " + w1 + "}{" + dt + "} = \\frac{" + (w2-w1) + "}{" + dt + "} = " + antwort + "\\,\\frac{\\text{rad}}{\\text{s}^2}";
    } else {
      fHz = rnd(2, 10);
      formelAnzeige = "T = \\frac{1}{f}";
      frage = "Ein Rad dreht sich mit $" + "f = " + fHz + "\\,\\text{Hz}$.\nWie groß ist die Periodendauer T?";
      antwort = parseFloat((1 / fHz).toFixed(3));
      prim = [parseFloat(fHz).toFixed(3), parseFloat((2 / fHz).toFixed(3)), parseFloat((1 / (2 * fHz)).toFixed(3))];
      prim = prim.map(function(p) { return parseFloat(p); });
      hinweis = "T = \\frac{1}{" + fHz + "} = " + antwort + "\\,\\text{s}";
    }
  } else {
    // Zentripetalbeschleunigung: a_z = v²/r, a_z = ω²·r, F_z = m·a_z
    if (d === 1) {
      v = rnd(3, 12); r = rnd(1, 4);
      formelAnzeige = "a_z = \\frac{v^2}{r}";
      frage = "Ein Körper bewegt sich mit $" + v + "\\,\\frac{\\text{m}}{\\text{s}}$ auf einer Kreisbahn mit $" + r + "\\,\\text{m}$ Radius.\nZentripetalbeschleunigung $" + "a_z$?";
      antwort = parseFloat((v * v / r).toFixed(2));
      prim = [parseFloat((v / r).toFixed(2)), parseFloat((v * r).toFixed(2)), parseFloat((v * v * r).toFixed(2))];
      hinweis = "a_z = \\frac{" + v + "^2}{" + r + "} = \\frac{" + (v*v) + "}{" + r + "} = " + antwort + "\\,\\frac{\\text{m}}{\\text{s}^2}";
    } else if (d === 2) {
      omega = rnd(2, 8); r = rnd(1, 3);
      formelAnzeige = "a_z = \\omega^2 \\cdot r";
      frage = "Berechne $" + "a_z$: $" + "\\omega = " + omega + "\\,\\frac{\\text{rad}}{\\text{s}}$, $" + "r = " + r + "\\,\\text{m}$.";
      antwort = parseFloat((omega * omega * r).toFixed(2));
      prim = [parseFloat((omega * r).toFixed(2)), parseFloat((omega * omega / r).toFixed(2)), parseFloat((omega * r * r).toFixed(2))];
      hinweis = "a_z = " + omega + "^2 \\cdot " + r + " = " + (omega*omega) + " \\cdot " + r + " = " + antwort + "\\,\\frac{\\text{m}}{\\text{s}^2}";
    } else if (d === 3) {
      a_z = rnd(4, 15); r = rnd(1, 4);
      formelAnzeige = "a_z = \\frac{v^2}{r} \\;\\Rightarrow\\; v = \\sqrt{a_z \\cdot r}";
      frage = "Gesucht ist v: $" + "a_z = " + a_z + "\\,\\frac{\\text{m}}{\\text{s}^2}$, $" + "r = " + r + "\\,\\text{m}$.";
      antwort = parseFloat(Math.sqrt(a_z * r).toFixed(2));
      prim = [parseFloat((a_z / r).toFixed(2)), parseFloat((a_z * r).toFixed(2)), parseFloat(Math.sqrt(a_z / r).toFixed(2))];
      hinweis = "v = \\sqrt{" + a_z + " \\cdot " + r + "} = \\sqrt{" + (a_z*r) + "} = " + antwort + "\\,\\frac{\\text{m}}{\\text{s}}";
    } else if (d === 4) {
      a_z = rnd(8, 25); omega = rnd(2, 6);
      formelAnzeige = "a_z = \\omega^2 \\cdot r \\;\\Rightarrow\\; r = \\frac{a_z}{\\omega^2}";
      frage = "Gesucht ist r: $" + "a_z = " + a_z + "\\,\\frac{\\text{m}}{\\text{s}^2}$, $" + "\\omega = " + omega + "\\,\\frac{\\text{rad}}{\\text{s}}$.";
      antwort = parseFloat((a_z / (omega * omega)).toFixed(2));
      prim = [parseFloat((a_z * omega * omega).toFixed(2)), parseFloat((a_z / omega).toFixed(2)), parseFloat(Math.sqrt(a_z / omega).toFixed(2))];
      hinweis = "r = \\frac{" + a_z + "}{" + omega + "^2} = \\frac{" + a_z + "}{" + (omega*omega) + "} = " + antwort + "\\,\\text{m}";
    } else {
      m = rnd(500, 2000); v = rnd(10, 30); r = rnd(10, 50);
      formelAnzeige = "F_z = m \\cdot \\frac{v^2}{r}";
      frage = "Ein Auto ($" + "m = " + m + "\\,\\text{kg}$) durchfährt eine Kurve ($" + "r = " + r + "\\,\\text{m}$) mit $" + "v = " + v + "\\,\\frac{\\text{m}}{\\text{s}}$.\nWie groß ist die Zentripetalkraft $" + "F_z$?";
      antwort = parseFloat((m * v * v / r).toFixed(0));
      prim = [parseFloat((m * v / r).toFixed(0)), parseFloat((m * v * v * r).toFixed(0)), parseFloat((m * v * r).toFixed(0))];
      hinweis = "F_z = " + m + " \\cdot \\frac{" + v + "^2}{" + r + "} = " + m + " \\cdot \\frac{" + (v*v) + "}{" + r + "} = " + antwort + "\\,\\text{N}";
    }
  }

  var distr = erzeugeDistraktoren(antwort, prim);
  // Formel oben in die Frage einbauen
  var formelDisplay = "\\boxed{" + formelAnzeige + "}";
  var frageKomplett = frage + "\\displaystyle\\ \\ " + formelDisplay;

  return {
    themaId: themaId,
    frage: frageKomplett,
    antwort: antwort,
    distr: distr,
    diff: d,
    hinweis: hinweis
  };
}

function initEngine() { var s = { skills: {}, diffs: {}, streaksWin: {}, lastSeen: {}, runde: 0, historie: [] }; TIDS.forEach(function (id) { s.skills[id] = 0.5; s.diffs[id] = 1; s.streaksWin[id] = 0; s.lastSeen[id] = 0; }); return s; }
function waehleThema(e) { var k = THEMEN.map(function (t) { return { id: t.id, score: (1 - e.skills[t.id]) * 1.2 + Math.min(e.runde - (e.lastSeen[t.id] || 0), 5) * 0.3 }; }).sort(function (x, y) { return y.score - x.score; }); var top = k.slice(0, Math.min(3, k.length)); return Math.random() < 0.7 ? top[0].id : top[rnd(0, top.length - 1)].id; }
function feedback(e, themaId, richtig, dauerSek) { var k = richtig ? (dauerSek < 15 ? 0.06 : 0.04) : -0.08; e.skills[themaId] = Math.max(0, Math.min(1, e.skills[themaId] + k)); e.streaksWin[themaId] = richtig ? e.streaksWin[themaId] + 1 : 0; if (richtig && e.streaksWin[themaId] >= 2) { e.diffs[themaId] = Math.min(5, e.diffs[themaId] + 1); e.streaksWin[themaId] = 0; } if (!richtig && e.diffs[themaId] > 1) e.diffs[themaId]--; e.lastSeen[themaId] = e.runde + 1; e.runde += 1; return e; }
function tippFuer(e) { var sortiert = THEMEN.slice().sort(function (a, b) { return e.skills[a.id] - e.skills[b.id]; }); var namen = { kinematik: "Kinematik", dreh: "Drehbewegungen", zentri: "Zentripetalbeschleunigung" }; return "Schwächstes Thema: " + namen[sortiert[0].id] + " (" + Math.round(e.skills[sortiert[0].id] * 100) + "%) · Stärkstes: " + namen[sortiert[2].id] + " (" + Math.round(e.skills[sortiert[2].id] * 100) + "%)."; }

var GADGETS = [ { emoji: "🌍", name: "Erde", punkte: 0 }, { emoji: "🌕", name: "Mond", punkte: 5 }, { emoji: "🚀", name: "Rakete", punkte: 15 }, { emoji: "🛸", name: "Raumstation", punkte: 30 }, { emoji: "👨‍🚀", name: "Astronaut", punkte: 50 }, { emoji: "🌌", name: "Galaxie", punkte: 75 }, { emoji: "👽", name: "Außerirdischer", punkte: 100 } ];
function titelFuerPunkte(p) { if (p >= 100) return "👽 Quanten-Meister"; if (p >= 75) return "🌌 Galaxis-Entdecker"; if (p >= 50) return "👨‍🚀 Astronaut"; if (p >= 30) return "🛸 Raumstations-Crew"; if (p >= 15) return "🚀 Raketen-Pilot"; if (p >= 5) return "🌕 Mondbesucher"; return "🌍 Weltraum-Novize"; }
function renderGadgets(score) { var reihe = document.getElementById("gadgetReihe"); document.getElementById("gadgetTitel").textContent = titelFuerPunkte(score); var html = ""; GADGETS.forEach(function(g) { if (score >= g.punkte) { html += '<div class="gadget aktiv" title="' + g.name + ' (' + g.punkte + ' Pkt)">' + g.emoji + '</div>'; } else { html += '<div class="gadget leer" title="🔒 bei ' + g.punkte + ' Punkten">🔒</div>'; } }); reihe.innerHTML = html; }

/* QR / Codec / SCORM / App-Logik (gekürzt) – identisch zur bruch.html */
var QEXP = new Uint8Array(512), QLOG = new Uint8Array(256);
(function () { var x = 1; for (var i = 0; i < 255; i++) { QEXP[i] = x; QLOG[x] = i; x <<= 1; if (x & 0x100) x ^= 0x11d; } for (var j = 255; j < 512; j++) QEXP[j] = QEXP[j - 255]; })();
function qmul(a, b) { return (a && b) ? QEXP[QLOG[a] + QLOG[b]] : 0; }
function qrGenPoly(n) { var g = [1]; for (var i = 0; i < n; i++) { var ng = new Array(g.length + 1).fill(0); for (var j = 0; j < g.length; j++) { ng[j] ^= g[j]; ng[j + 1] ^= qmul(g[j], QEXP[i]); } g = ng; } return g; }
function qrRs(data, n) { var g = qrGenPoly(n), res = new Array(n).fill(0); for (var i = 0; i < data.length; i++) { var f = data[i] ^ res[0]; res.shift(); res.push(0); if (f) for (var k = 0; k < n; k++) res[k] ^= qmul(g[k + 1], f); } return res; }
function qrEncodeData(bytes, v) { var cap = [0, 19, 34, 55, 80, 108][v], ecN = [0, 7, 10, 15, 20, 26][v], bits = []; function push(x, l) { for (var i = l - 1; i >= 0; i--) bits.push((x >> i) & 1); } push(4, 4); push(bytes.length, 8); for (var i = 0; i < bytes.length; i++) push(bytes[i], 8); var max = cap * 8; for (var j = 0; j < 4 && bits.length < max; j++) bits.push(0); while (bits.length % 8) bits.push(0); var out = []; for (var k = 0; k < bits.length; k += 8) { var x = 0; for (var m = 0; m < 8; m++) x = (x << 1) | bits[k + m]; out.push(x); } var pads = [0xEC, 0x11], pi = 0; while (out.length < cap) out.push(pads[pi++ % 2]); return out.concat(qrRs(out, ecN)); }
function qrBuildMatrix(v, cw) { var n = v * 4 + 17, m = [], y, x, i, r, c; for (y = 0; y < n; y++) { m.push(new Array(n).fill(null)); } function set(yy, xx, val) { m[yy][xx] = val; } function finder(fy, fx) { for (r = -1; r <= 7; r++) for (c = -1; c <= 7; c++) { var yy = fy + r, xx = fx + c; if (yy < 0 || yy >= n || xx < 0 || xx >= n) continue; var d = (r >= 0 && r <= 6 && (c === 0 || c === 6)) || (c >= 0 && c <= 6 && (r === 0 || r === 6)) || (r >= 2 && r <= 4 && c >= 2 && c <= 4); set(yy, xx, d ? 1 : 0); } } finder(0, 0); finder(0, n - 7); finder(n - 7, 0); for (i = 8; i < n - 8; i++) { var t = i % 2 === 0 ? 1 : 0; if (m[6][i] === null) set(6, i, t); if (m[i][6] === null) set(i, 6, t); } if (v >= 2) { var ap = 4 * v + 10; for (r = -2; r <= 2; r++) for (c = -2; c <= 2; c++) set(ap + r, ap + c, Math.max(Math.abs(r), Math.abs(c)) !== 1 ? 1 : 0); } var dataBits = (0b01 << 3) | 0, d2 = dataBits << 10; while (d2.toString(2).length >= 11) d2 ^= 0b10100110111 << (d2.toString(2).length - 11); var fmt = ((dataBits << 10) | d2) ^ 0b101010000010010; for (i = 0; i < 15; i++) { var mod = (fmt >> i) & 1; if (i < 6) set(i, 8, mod); else if (i < 8) set(i + 1, 8, mod); else set(n - 15 + i, 8, mod); if (i < 8) set(8, n - i - 1, mod); else if (i < 9) set(8, 15 - i, mod); else set(8, 14 - i, mod); } set(n - 8, 8, 1); var idx = 0, up = true; for (var col = n - 1; col > 0; col -= 2) { if (col === 6) col--; for (i = 0; i < n; i++) { var yy2 = up ? n - 1 - i : i; for (var cc = 0; cc < 2; cc++) { var xx2 = col - cc; if (m[yy2][xx2] !== null) continue; var val = 0; if (idx < cw.length * 8) { val = (cw[idx >> 3] >> (7 - (idx & 7))) & 1; idx++; } if ((xx2 + yy2) % 2 === 0) val ^= 1; set(yy2, xx2, val); } } up = !up; } for (y = 0; y < n; y++) for (x = 0; x < n; x++) if (m[y][x] === null) m[y][x] = 0; return m; }
function qrMake(bytes) { for (var v = 1; v <= 5; v++) if (bytes.length + 2 <= [0, 19, 34, 55, 80, 108][v]) return qrBuildMatrix(v, qrEncodeData(bytes, v)); return null; }
function stateToBytes(e, score) { var b = [1]; TIDS.forEach(function (id) { b.push(Math.round(e.skills[id] * 100)); }); TIDS.forEach(function (id) { b.push(e.diffs[id]); }); TIDS.forEach(function (id) { b.push(Math.min(255, e.streaksWin[id] || 0)); }); TIDS.forEach(function (id) { b.push(Math.min(255, e.lastSeen[id] || 0)); }); b.push((e.runde >> 8) & 255, e.runde & 255); b.push((score >> 8) & 255, score & 255); var sum = 0; for (var i = 1; i < b.length; i++) sum = (sum + b[i]) & 255; b.push(sum); return b; }
function bytesToState(bytes) { if (!bytes || bytes[0] !== 1) return null; var sum = 0; for (var i = 1; i < bytes.length - 1; i++) sum = (sum + bytes[i]) & 255; if (sum !== bytes[bytes.length - 1]) return null; var e = initEngine(), score, runde; for (var j = 0; j < 3; j++) { e.skills[TIDS[j]] = bytes[1 + j] / 100; e.diffs[TIDS[j]] = Math.max(1, Math.min(5, bytes[4 + j])); e.streaksWin[TIDS[j]] = bytes[7 + j]; e.lastSeen[TIDS[j]] = bytes[10 + j]; } e.runde = (bytes[13] << 8) | bytes[14]; score = (bytes[15] << 8) | bytes[16]; return { engine: e, score: score }; }
function bytesToCode(b) { var s = ""; for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]); return btoa(s); }
function codeToBytes(code) { try { var t = (code || "").replace(/\s+/g, ""); var h = t.lastIndexOf("#"); if (h >= 0) t = t.slice(h + 1); var q = t.indexOf("?"); if (q >= 0) t = t.slice(0, q); var s = atob(t); var r = []; for (var i = 0; i < s.length; i++) r.push(s.charCodeAt(i)); return r.length >= 17 ? r : null; } catch (e) { return null; } }
function ladeAusHash() { try { var hash = location.hash; if (!hash || hash.length < 2) return false; var res = bytesToState(codeToBytes(hash.substring(1))); if (!res) return false; engine = res.engine; score = res.score; history.replaceState(null, "", location.pathname + location.search); return true; } catch (e) { return false; } }
function shareLink() { var base = location.href.split("#")[0]; return base + "#" + bytesToCode(stateToBytes(engine, score)); }
var scormAPI = null; (function () { try { var w = window; while (w.parent && w.parent !== w) { if (w.parent.API) { scormAPI = w.parent.API; return; } w = w.parent; } if (window.opener && window.opener.API) scormAPI = window.opener.API; } catch (e) {} })();
var lmsAktiv = false;
function lmsInit() { if (!scormAPI) return; lmsAktiv = scormAPI.LMSInitialize("") === "true"; if (!lmsAktiv) return; var sd = scormAPI.LMSGetValue("cmi.suspend_data"); var res = (sd && codeToBytes(sd)) ? bytesToState(codeToBytes(sd)) : null; if (!window._hashGeladen) { var lokaler = ladeLokal(); var lokalRes = (lokaler && codeToBytes(lokaler)) ? bytesToState(codeToBytes(lokaler)) : null; var quelle = res || lokalRes; if (quelle) { engine = quelle.engine; score = quelle.score; } } scormAPI.LMSSetValue("cmi.core.lesson_status", "incomplete"); scormAPI.LMSCommit(""); }
function lmsSync() { if (!lmsAktiv || !scormAPI) return; var pct = engine.runde > 0 ? Math.round(score / engine.runde * 100) : 0; scormAPI.LMSSetValue("cmi.core.score.raw", pct); scormAPI.LMSSetValue("cmi.core.score.min", "0"); scormAPI.LMSSetValue("cmi.core.score.max", "100"); scormAPI.LMSSetValue("cmi.core.lesson_status", engine.runde >= 10 ? "completed" : "incomplete"); scormAPI.LMSSetValue("cmi.suspend_data", bytesToCode(stateToBytes(engine, score))); scormAPI.LMSCommit(""); }
function lmsFinish() { if (lmsAktiv && scormAPI) { try { scormAPI.LMSFinish(""); } catch (e) {} } }
window.addEventListener("beforeunload", lmsFinish);
var engine = initEngine(), score = 0, modus = "mc", aufgabe, ergebnis = null, auswahl = null, startZeit = 0, panelOffen = false;
function ladeLokal() { try { return localStorage.getItem(SPEICHER_KEY); } catch (e) { return null; } }
function speichere() { try { localStorage.setItem(SPEICHER_KEY, bytesToCode(stateToBytes(engine, score))); return true; } catch (e) { return false; } }
function ladeLokalInState() { var c = ladeLokal(); if (!c) return; var res = bytesToState(codeToBytes(c)); if (res) { engine = res.engine; score = res.score; } }
function neueAufgabe() { var tid = waehleThema(engine); aufgabe = makeAufgabe(tid, engine.diffs[tid]); ergebnis = null; auswahl = null; startZeit = Date.now(); render(); }
function beantworten(wert) { if (ergebnis !== null) return; var num = parseFloat(parseFloat(wert).toFixed(2)); var richtig = Math.abs(num - aufgabe.antwort) < 0.01; auswahl = num; ergebnis = richtig; if (richtig) score++; feedback(engine, aufgabe.themaId, richtig, (Date.now() - startZeit) / 1000); speichere(); lmsSync(); render(); }
function weiter() { neueAufgabe(); }
function setModus(m) { modus = m; render(); }
function zuruecksetzen() { try { localStorage.removeItem(SPEICHER_KEY); } catch (e) {} engine = initEngine(); score = 0; if (lmsAktiv && scormAPI) { scormAPI.LMSSetValue("cmi.suspend_data", ""); scormAPI.LMSCommit(""); } neueAufgabe(); renderStatus(); }
function togglePanel() { panelOffen = !panelOffen; renderPanel(); }
function codeKopieren() { var ta = document.getElementById("exportCode"); ta.select(); try { document.execCommand("copy"); if (navigator.clipboard) navigator.clipboard.writeText(ta.value); } catch (e) {} }
function codeLaden() { var res = bytesToState(codeToBytes(document.getElementById("importCode").value)); var msg = document.getElementById("importMsg"); if (!res) { msg.className = "msg no"; msg.textContent = "❌ Ungültiger Code"; return; } engine = res.engine; score = res.score; speichere(); lmsSync(); msg.className = "msg ok"; msg.textContent = "✅ Übernommen!"; neueAufgabe(); renderStatus(); }
function renderStatus() { document.getElementById("scoreEl").textContent = score; document.getElementById("rundeEl").textContent = "Punkte · Runde " + engine.runde; }
function renderSkills() { var html = ""; var namen = { kinematik: "Kinematik", dreh: "Drehbewegungen", zentri: "Zentripetalbeschl." }; THEMEN.forEach(function (t) { var p = engine.skills[t.id]; var farbe = p > 0.7 ? "#10b981" : p > 0.4 ? "#fbbf24" : "#fb7185"; html += '<div class="skill"><div class="name">' + namen[t.id] + '</div><div class="bar"><div style="width:' + (p * 100) + '%;background:' + farbe + '"></div></div><div class="st">St. ' + engine.diffs[t.id] + "</div></div>"; }); document.getElementById("skills").innerHTML = html; document.getElementById("analyseEl").innerHTML = "<b>🤖 Trainer-Analyse:</b> " + tippFuer(engine); }

function renderAufgabe() {
  var namen = { kinematik: "Kinematik", dreh: "Drehbewegungen", zentri: "Zentripetalbeschleunigung" };
  document.getElementById("themaBadge").textContent = namen[aufgabe.themaId].toUpperCase();
  document.getElementById("frageEl").innerHTML = "$" + aufgabe.frage + "$";
  document.getElementById("tabMC").className = modus === "mc" ? "aktiv" : "";
  document.getElementById("tabIN").className = modus === "input" ? "aktiv" : "";
  
  var box = document.getElementById("antwortBox"), html = "";
  if (modus === "mc") {
    var opt = [aufgabe.antwort].concat(aufgabe.distr);
    while (opt.length < 4) { var x = aufgabe.antwort + (opt.length * 0.5); if (opt.indexOf(x) === -1) opt.push(parseFloat(x.toFixed(2))); else break; }
    opt.sort(function () { return Math.random() - 0.5; });
    opt.forEach(function (o) {
      var cls = "";
      if (ergebnis !== null) { if (Math.abs(o - aufgabe.antwort) < 0.01) cls = "richtig"; else if (Math.abs(o - auswahl) < 0.01) cls = "falsch"; else cls = "gedimmt"; }
      html += '<button class="' + cls + '" ' + (ergebnis !== null ? "disabled" : "onclick=\"beantworten(" + o + ')"') + ">" + o + "</button>";
    });
    box.className = "mc"; box.innerHTML = html;
  } else {
    html = '<input id="eingabeIn" type="number" step="any" inputmode="decimal" placeholder="Zahl eingeben" ' + (ergebnis !== null ? 'value="' + auswahl + '" disabled' : "") + ' onkeydown="if(event.key===\'Enter\')beantworten(this.value)"><button ' + (ergebnis !== null ? "disabled" : 'onclick="beantworten(document.getElementById(\'eingabeIn\').value)"') + ">OK</button>";
    box.className = "eingabe"; box.innerHTML = html;
    if (ergebnis === null) { var inp = document.getElementById("eingabeIn"); inp.focus(); }
  }
  
  var fb = document.getElementById("feedbackBox");
  if (ergebnis !== null) {
    var zusatz = aufgabe.hinweis ? ' 💡 <span class="hinweis">' + aufgabe.hinweis + "</span>" : "";
    var fbHtml = '<div class="feedback ' + (ergebnis ? "ok" : "no") + '">' + (ergebnis ? "✅ Richtig!" : "❌ Leider falsch. Richtig ist " + aufgabe.antwort + ".") + zusatz + '</div><button class="weiter" onclick="weiter()">Nächste Aufgabe →</button>';
    fb.innerHTML = fbHtml;
    // KaTeX im Feedback rendern
    try {
      if (typeof katex !== 'undefined') {
        fb.innerHTML = fb.innerHTML.replace(/\$(.+?)\$/g, function(m, tex) { try { return katex.renderToString(tex, { displayMode: false, throwOnError: false }); } catch(e) { return m; } });
      }
    } catch(e) {}
  } else fb.innerHTML = "";
}

function renderPanel() {
  document.getElementById("panelBody").className = panelOffen ? "panel-body offen" : "panel-body";
  document.getElementById("panelPfeil").textContent = panelOffen ? "▾" : "▸";
  if (!panelOffen) return;
  var code = bytesToCode(stateToBytes(engine, score));
  var link = shareLink();
  document.getElementById("exportCode").value = link;
  var linkBytes = [];
  for (var li = 0; li < link.length; li++) linkBytes.push(link.charCodeAt(li));
  var m = qrMake(linkBytes), svg = "";
  if (m) { var n = m.length + 8, rects = ""; for (var y = 0; y < m.length; y++) for (var x = 0; x < m.length; x++) if (m[y][x]) rects += '<rect x="' + (x + 4) + '" y="' + (y + 4) + '" width="1" height="1" fill="black"/>'; svg = '<svg viewBox="0 0 ' + n + " " + n + '" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/>' + rects + "</svg>"; } else svg = "<p>Zu groß.</p>";
  document.getElementById("qr").innerHTML = svg;
}
function render() { renderStatus(); renderSkills(); renderGadgets(score); renderAufgabe(); if (panelOffen) renderPanel(); }
document.addEventListener("keydown", function (e) { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); speichere(); renderStatus(); } });
(function start() { window._hashGeladen = ladeAusHash(); if (window._hashGeladen) { speichere(); lmsSync(); } else if (scormAPI) { lmsInit(); } else { ladeLokalInState(); } neueAufgabe(); })();
</script>
