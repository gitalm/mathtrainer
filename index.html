<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧮 Adaptiver Mathe-Trainer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #f8fafc; color: #1e293b; padding: 16px; }
  .wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .kopf { display: flex; justify-content: space-between; align-items: flex-start; }
  h1 { font-size: 22px; }
  .sub { font-size: 13px; color: #64748b; }
  .punkte { text-align: right; }
  .punkte .zahl { font-size: 28px; font-weight: 800; color: #4f46e5; }
  .punkte .label { font-size: 11px; color: #94a3b8; }
  .skills { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .skill { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 8px 4px; text-align: center; }
  .skill .name { font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .skill .bar { height: 6px; background: #f1f5f9; border-radius: 99px; overflow: hidden; margin: 5px 6px 3px; }
  .skill .bar > div { height: 100%; border-radius: 99px; }
  .skill .st { font-size: 10px; color: #94a3b8; }
  .leiste { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 8px 14px; font-size: 12px; color: #64748b; display: flex; justify-content: space-between; align-items: center; }
  .leiste button, .panel-head button { background: none; border: none; color: #e11d48; font-size: 12px; font-weight: 600; cursor: pointer; text-decoration: underline; }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 22px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  .zeile { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .badge { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: #4f46e5; background: #eef2ff; padding: 4px 10px; border-radius: 6px; }
  .tabs { display: flex; gap: 2px; background: #f1f5f9; border-radius: 8px; padding: 3px; }
  .tabs button { border: none; background: none; font-size: 12px; padding: 5px 10px; border-radius: 6px; color: #64748b; cursor: pointer; }
  .tabs button.aktiv { background: #fff; color: #1e293b; font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .frage { text-align: center; font-size: 42px; font-weight: 700; padding: 22px 0; letter-spacing: .03em; }
  .mc { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .mc button { font-size: 20px; font-weight: 600; padding: 14px; border-radius: 12px; border: 2px solid #e2e8f0; background: #fff; cursor: pointer; transition: background .15s; }
  .mc button:hover:not(:disabled) { background: #eef2ff; }
  .mc button.richtig { background: #d1fae5; border-color: #34d399; }
  .mc button.falsch { background: #ffe4e6; border-color: #fb7185; }
  .mc button.gedimmt { opacity: .55; }
  .eingabe { display: flex; gap: 8px; justify-content: center; }
  .eingabe input { width: 130px; text-align: center; font-size: 22px; font-weight: 600; border: 2px solid #e2e8f0; border-radius: 12px; padding: 10px; }
  .eingabe input:focus { outline: none; border-color: #818cf8; }
  .eingabe button, .weiter { background: #4f46e5; color: #fff; font-weight: 600; border: none; border-radius: 12px; padding: 10px 22px; font-size: 14px; cursor: pointer; }
  .eingabe button:disabled { opacity: .4; cursor: default; }
  .feedback { margin-top: 16px; border-radius: 12px; padding: 14px; font-weight: 500; }
  .feedback.ok { background: #ecfdf5; color: #047857; }
  .feedback.no { background: #fff1f2; color: #be123c; }
  .weiter { width: 100%; margin-top: 10px; background: #4f46e5; }
  .weiter:hover { background: #4338ca; }
  .analyse { background: #eef2ff; border: 1px solid #e0e7ff; border-radius: 14px; padding: 14px; font-size: 13px; color: #3730a3; }
  .panel { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 14px; }
  .panel-head { width: 100%; display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 14px; background: none; border: none; cursor: pointer; color: #334155; }
  .panel-body { display: none; margin-top: 14px; grid-template-columns: 1fr 1fr; gap: 20px; }
  .panel-body.offen { display: grid; }
  .panel-body h4 { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #94a3b8; margin-bottom: 6px; }
  .qrbox { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .qrbox svg { width: 170px; height: 170px; border: 1px solid #e2e8f0; border-radius: 8px; }
  .qrbox small { font-size: 10px; color: #94a3b8; }
  .codefeld { width: 100%; font-family: monospace; font-size: 11px; border: 1px solid #e2e8f0; border-radius: 8px; padding: 7px; background: #f8fafc; resize: none; }
  .copy { background: #4f46e5; color: #fff; border: none; border-radius: 8px; padding: 7px 14px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .laden { width: 100%; background: #059669; color: #fff; border: none; border-radius: 10px; padding: 9px; font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 8px; }
  .laden:hover { background: #047857; }
  .msg { font-size: 12px; margin-top: 8px; }
  .msg.ok { color: #059669; } .msg.no { color: #e11d48; }
  @media (max-width: 640px) { .skills { grid-template-columns: repeat(5, 1fr); gap: 4px; } .panel-body { grid-template-columns: 1fr; } .frage { font-size: 32px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="kopf">
    <div>
      <h1>🧮 Adaptiver Mathe-Trainer</h1>
      <div class="sub">Die Mini-KI wählt Themen &amp; Schwierigkeit passend zu dir.</div>
    </div>
    <div class="punkte">
      <div class="zahl" id="scoreEl">0</div>
      <div class="label" id="rundeEl">Punkte · Runde 0</div>
    </div>
  </div>

  <div class="skills" id="skills"></div>

  <div class="leiste">
    <span id="saveStatus">💾 Auto-Save aktiv · mit Strg+S manuell speichern</span>
    <button onclick="zuruecksetzen()">Spielstand löschen</button>
  </div>

  <div class="panel">
    <button class="panel-head" onclick="togglePanel()">
      <span>📱 Auf anderem Gerät weitermachen (QR / Code)</span><span id="panelPfeil">▸</span>
    </button>
    <div class="panel-body" id="panelBody">
      <div>
        <h4>Spielstand exportieren</h4>
        <div class="qrbox"><div id="qr"></div><small>QR scannen → Website öffnet sich mit deinem Spielstand</small></div>
        <div style="display:flex;gap:6px;margin-top:8px">
          <textarea class="codefeld" id="exportCode" rows="2" readonly></textarea>
          <button class="copy" onclick="codeKopieren()">Kopieren</button>
        </div>
      </div>
      <div>
        <h4>Spielstand laden</h4>
        <textarea class="codefeld" id="importCode" rows="3" placeholder="Code hier einfügen (vom QR-Scan oder kopiert)…"></textarea>
        <button class="laden" onclick="codeLaden()">Spielstand übernehmen</button>
        <div class="msg" id="importMsg"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="zeile">
      <span class="badge" id="themaBadge">ADDITION</span>
      <div class="tabs">
        <button id="tabMC" onclick="setModus('mc')" class="aktiv">Multiple Choice</button>
        <button id="tabIN" onclick="setModus('input')" class="aktiv">Freie Eingabe</button>
      </div>
    </div>
    <div class="frage" id="frageEl"></div>
    <div id="antwortBox"></div>
    <div id="feedbackBox"></div>
  </div>

  <div class="analyse" id="analyseEl"></div>
</div>

<script>
/* ============================================================
   Engine (adaptives Regelwerk)
   ============================================================ */
var THEMEN = [
  { id: "add", name: "Addition" },
  { id: "sub", name: "Subtraktion" },
  { id: "mul", name: "Multiplikation" },
  { id: "div", name: "Division" },
  { id: "gemischt", name: "Gemischte Terme" }
];
var TIDS = THEMEN.map(function (t) { return t.id; });
var SPEICHER_KEY = "mathe-trainer-spielstand";

function rnd(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

/* ============================================================
   Verbesserte Distraktor-Erzeugung (pädagogisch sinnvoll)
   ============================================================ */
function erzeugeDistraktoren(antwort, themaId, aufgabe) {
  var fehler = [];

  if (themaId === "add") {
    // Addition: Klassiker-Fehler
    fehler.push(antwort + 1);           // Einer vergessen/zuviel
    fehler.push(antwort - 1);           // Einer zu wenig
    fehler.push(antwort + 10);          // Zehnerüberschlag vergessen
    fehler.push(antwort - 10);          // Zehner zu wenig
  } else if (themaId === "sub") {
    // Subtraktion: Typische Fehler
    fehler.push(antwort + 1);
    fehler.push(antwort - 1);
    fehler.push(aufgabe.a - aufgabe.b + 2 * aufgabe.b); // "Kleiner minus größer"-Vertauschung
    fehler.push(antwort + 10);
  } else if (themaId === "mul") {
    // Multiplikation: Nachbar-Reihe, verwechselte Operation
    fehler.push((aufgabe.a - 1) * aufgabe.b);   // Eine Reihe tiefer
    fehler.push(aufgabe.a * (aufgabe.b - 1));   // Anderer Faktor -1
    fehler.push(aufgabe.a + aufgabe.b);          // Addiert statt multipliziert
    fehler.push(aufgabe.a * aufgabe.b + aufgabe.a); // Einmal extra
  } else if (themaId === "div") {
    // Division: Ergebnis verwechselt, Divisor statt Ergebnis
    fehler.push(aufgabe.b);                      // Divisor statt Ergebnis
    fehler.push(Math.round(aufgabe.a / aufgabe.b) + 1); // Eins mehr
    fehler.push(Math.round(aufgabe.a / aufgabe.b) - 1); // Eins weniger
    fehler.push(aufgabe.a);                      // Dividend statt Ergebnis
  } else if (themaId === "gemischt") {
    // Gemischte Terme: Punkt vor Strich!
    if (aufgabe.d <= 2) {
      // a + b · c   → Klassiker: (a+b)·c
      fehler.push((aufgabe.a + aufgabe.b) * aufgabe.c);   // Strich vor Punkt ❌
      fehler.push(aufgabe.a + aufgabe.b + aufgabe.c);     // Alles addiert
      fehler.push(aufgabe.a * aufgabe.b + aufgabe.c);     // Falsche Assoziation
      fehler.push(aufgabe.a * aufgabe.c + aufgabe.b);     // Andere Klammerung
    } else if (aufgabe.d === 3) {
      // (a + b) · c   → Klammer vergessen: a + b·c
      fehler.push(aufgabe.a + aufgabe.b * aufgabe.c);     // Klammer ignoriert
      fehler.push((aufgabe.a + aufgabe.b) * aufgabe.c + aufgabe.c); // Zu viel
      fehler.push(aufgabe.a * aufgabe.c + aufgabe.b);     // Falsch ausgeklammert
    } else {
      // a · b − c · e   → Punkt vor Strich
      fehler.push(aufgabe.a * aufgabe.b + aufgabe.c * aufgabe.e); // Minus vergessen
      fehler.push(aufgabe.a * (aufgabe.b - aufgabe.c) * aufgabe.e); // Falsche Klammer
      fehler.push((aufgabe.a - aufgabe.c) * (aufgabe.b - aufgabe.e)); // Alles falsch
      fehler.push(aufgabe.a * aufgabe.b - aufgabe.c - aufgabe.e); // Nur eine Mul
    }
  }

  // Eindeutig machen: Keine Duplikate, nicht die richtige Antwort, keine negativen Zahlen
  var uniq = [];
  for (var i = 0; i < fehler.length; i++) {
    var v = Math.round(fehler[i]);
    if (v !== antwort && v >= 0 && uniq.indexOf(v) === -1) {
      uniq.push(v);
    }
  }

  // Fallback: Immer 3 Distraktoren garantieren (mit nahen Werten auffüllen)
  for (var delta = 1; uniq.length < 3 && delta < 50; delta++) {
    [antwort + delta, antwort - delta].forEach(function (v) {
      if (uniq.length < 3 && v !== antwort && uniq.indexOf(v) === -1 && v >= 0) {
        uniq.push(v);
      }
    });
  }

  return uniq.slice(0, 3);
}

function makeAufgabe(themaId, diff) {
  var d = Math.max(1, Math.min(5, diff)), a, b, frage, antwort, c, e;
  var aufgabe = { themaId: themaId, diff: d };

  if (themaId === "add") {
    var max = [10, 20, 50, 100, 200][d - 1];
    a = rnd(2, max); b = rnd(2, max);
    frage = a + " + " + b; antwort = a + b;
    aufgabe.a = a; aufgabe.b = b;
  } else if (themaId === "sub") {
    var max2 = [10, 20, 50, 100, 200][d - 1];
    a = rnd(5, max2); b = rnd(2, a);
    frage = a + " − " + b; antwort = a - b;
    aufgabe.a = a; aufgabe.b = b;
  } else if (themaId === "mul") {
    var m = [5, 10, 12, 15, 20][d - 1];
    a = rnd(2, m); b = rnd(2, m);
    frage = a + " · " + b; antwort = a * b;
    aufgabe.a = a; aufgabe.b = b;
  } else if (themaId === "div") {
    var m2 = [5, 10, 12, 15, 20][d - 1];
    b = rnd(2, m2); antwort = rnd(2, m2); a = b * antwort;
    frage = a + " ÷ " + b; antwort = a / b;
    aufgabe.a = a; aufgabe.b = b;
  } else {
    a = rnd(2, 5 * d); b = rnd(2, 5 * d); c = rnd(2, 3 * d);
    if (d <= 2) {
      frage = a + " + " + b + " · " + c;
      antwort = a + b * c;  // ✅ Punkt vor Strich
      aufgabe.a = a; aufgabe.b = b; aufgabe.c = c;
    } else if (d === 3) {
      frage = "(" + a + " + " + b + ") · " + c;
      antwort = (a + b) * c;
      aufgabe.a = a; aufgabe.b = b; aufgabe.c = c;
    } else {
      e = rnd(2, 4);
      frage = a + " · " + b + " − " + c + " · " + e;
      antwort = a * b - c * e;
      aufgabe.a = a; aufgabe.b = b; aufgabe.c = c; aufgabe.e = e;
    }
  }

  aufgabe.frage = frage;
  aufgabe.antwort = antwort;
  aufgabe.distr = erzeugeDistraktoren(antwort, themaId, aufgabe);

  return aufgabe;
}

function initEngine() {
  var s = { skills: {}, diffs: {}, streaksWin: {}, lastSeen: {}, runde: 0, historie: [] };
  TIDS.forEach(function (id) { s.skills[id] = 0.5; s.diffs[id] = 1; s.streaksWin[id] = 0; s.lastSeen[id] = 0; });
  return s;
}
function waehleThema(e) {
  var k = THEMEN.map(function (t) {
    return { id: t.id, score: (1 - e.skills[t.id]) * 1.2 + Math.min(e.runde - (e.lastSeen[t.id] || 0), 5) * 0.3 };
  }).sort(function (x, y) { return y.score - x.score; });
  var top = k.slice(0, Math.min(3, k.length));
  return Math.random() < 0.7 ? top[0].id : top[rnd(0, top.length - 1)].id;
}
function feedback(e, themaId, richtig, dauerSek) {
  var k = richtig ? (dauerSek < 8 ? 0.06 : 0.04) : -0.08;
  e.skills[themaId] = Math.max(0, Math.min(1, e.skills[themaId] + k));
  e.streaksWin[themaId] = richtig ? e.streaksWin[themaId] + 1 : 0;
  if (richtig && e.streaksWin[themaId] >= 2) { e.diffs[themaId] = Math.min(5, e.diffs[themaId] + 1); e.streaksWin[themaId] = 0; }
  if (!richtig && e.diffs[themaId] > 1) e.diffs[themaId]--;
  e.lastSeen[themaId] = e.runde + 1;
  e.runde += 1;
  return e;
}
function tippFuer(e) {
  var sortiert = THEMEN.slice().sort(function (a, b) { return e.skills[a.id] - e.skills[b.id]; });
  return "Schwächstes Thema: " + sortiert[0].name + " (" + Math.round(e.skills[sortiert[0].id] * 100) + "%) · Stärkstes: " + sortiert[4].name +
    " (" + Math.round(e.skills[sortiert[4].id] * 100) + "%). Nächste Aufgaben fokussieren " + sortiert[0].name + ".";
}

/* ============================================================
   QR-Code-Generator (reines JS)
   ============================================================ */
var QEXP = new Uint8Array(512), QLOG = new Uint8Array(256);
(function () { var x = 1; for (var i = 0; i < 255; i++) { QEXP[i] = x; QLOG[x] = i; x <<= 1; if (x & 0x100) x ^= 0x11d; } for (var j = 255; j < 512; j++) QEXP[j] = QEXP[j - 255]; })();
function qmul(a, b) { return (a && b) ? QEXP[QLOG[a] + QLOG[b]] : 0; }
function qrGenPoly(n) { var g = [1]; for (var i = 0; i < n; i++) { var ng = new Array(g.length + 1).fill(0); for (var j = 0; j < g.length; j++) { ng[j] ^= g[j]; ng[j + 1] ^= qmul(g[j], QEXP[i]); } g = ng; } return g; }
function qrRs(data, n) { var g = qrGenPoly(n), res = new Array(n).fill(0); for (var i = 0; i < data.length; i++) { var f = data[i] ^ res[0]; res.shift(); res.push(0); if (f) for (var k = 0; k < n; k++) res[k] ^= qmul(g[k + 1], f); } return res; }
function qrEncodeData(bytes, v) {
  var cap = [0, 19, 34, 55, 80, 108][v], ecN = [0, 7, 10, 15, 20, 26][v], bits = [];
  function push(x, l) { for (var i = l - 1; i >= 0; i--) bits.push((x >> i) & 1); }
  push(4, 4); push(bytes.length, 8);
  for (var i = 0; i < bytes.length; i++) push(bytes[i], 8);
  var max = cap * 8;
  for (var j = 0; j < 4 && bits.length < max; j++) bits.push(0);
  while (bits.length % 8) bits.push(0);
  var out = []; for (var k = 0; k < bits.length; k += 8) { var x = 0; for (var m = 0; m < 8; m++) x = (x << 1) | bits[k + m]; out.push(x); }
  var pads = [0xEC, 0x11], pi = 0;
  while (out.length < cap) out.push(pads[pi++ % 2]);
  return out.concat(qrRs(out, ecN));
}
function qrBuildMatrix(v, cw) {
  var n = v * 4 + 17, m = [], y, x, i, r, c;
  for (y = 0; y < n; y++) { m.push(new Array(n).fill(null)); }
  function set(yy, xx, val) { m[yy][xx] = val; }
  function finder(fy, fx) {
    for (r = -1; r <= 7; r++) for (c = -1; c <= 7; c++) {
      var yy = fy + r, xx = fx + c; if (yy < 0 || yy >= n || xx < 0 || xx >= n) continue;
      var d = (r >= 0 && r <= 6 && (c === 0 || c === 6)) || (c >= 0 && c <= 6 && (r === 0 || r === 6)) || (r >= 2 && r <= 4 && c >= 2 && c <= 4);
      set(yy, xx, d ? 1 : 0);
    }
  }
  finder(0, 0); finder(0, n - 7); finder(n - 7, 0);
  for (i = 8; i < n - 8; i++) { var t = i % 2 === 0 ? 1 : 0; if (m[6][i] === null) set(6, i, t); if (m[i][6] === null) set(i, 6, t); }
  if (v >= 2) { var ap = 4 * v + 10; for (r = -2; r <= 2; r++) for (c = -2; c <= 2; c++) set(ap + r, ap + c, Math.max(Math.abs(r), Math.abs(c)) !== 1 ? 1 : 0); }
  var dataBits = (0b01 << 3) | 0, d2 = dataBits << 10;
  while (d2.toString(2).length >= 11) d2 ^= 0b10100110111 << (d2.toString(2).length - 11);
  var fmt = ((dataBits << 10) | d2) ^ 0b101010000010010;
  for (i = 0; i < 15; i++) {
    var mod = (fmt >> i) & 1;
    if (i < 6) set(i, 8, mod); else if (i < 8) set(i + 1, 8, mod); else set(n - 15 + i, 8, mod);
    if (i < 8) set(8, n - i - 1, mod); else if (i < 9) set(8, 15 - i, mod); else set(8, 14 - i, mod);
  }
  set(n - 8, 8, 1);
  var idx = 0, up = true;
  for (var col = n - 1; col > 0; col -= 2) {
    if (col === 6) col--;
    for (i = 0; i < n; i++) {
      var yy2 = up ? n - 1 - i : i;
      for (var cc = 0; cc < 2; cc++) {
        var xx2 = col - cc; if (m[yy2][xx2] !== null) continue;
        var val = 0;
        if (idx < cw.length * 8) { val = (cw[idx >> 3] >> (7 - (idx & 7))) & 1; idx++; }
        if ((xx2 + yy2) % 2 === 0) val ^= 1;
        set(yy2, xx2, val);
      }
    }
    up = !up;
  }
  for (y = 0; y < n; y++) for (x = 0; x < n; x++) if (m[y][x] === null) m[y][x] = 0;
  return m;
}
function qrMake(bytes) {
  for (var v = 1; v <= 5; v++) if (bytes.length + 2 <= [0, 19, 34, 55, 80, 108][v]) return qrBuildMatrix(v, qrEncodeData(bytes, v));
  return null;
}

/* ============================================================
   Codec: Spielstand <-> Code (base64)
   ============================================================ */
function stateToBytes(e, score) {
  var b = [1];
  TIDS.forEach(function (id) { b.push(Math.round(e.skills[id] * 100)); });
  TIDS.forEach(function (id) { b.push(e.diffs[id]); });
  TIDS.forEach(function (id) { b.push(Math.min(255, e.streaksWin[id] || 0)); });
  TIDS.forEach(function (id) { b.push(Math.min(255, e.lastSeen[id] || 0)); });
  b.push((e.runde >> 8) & 255, e.runde & 255);
  b.push((score >> 8) & 255, score & 255);
  var sum = 0; for (var i = 1; i < b.length; i++) sum = (sum + b[i]) & 255;
  b.push(sum);
  return b;
}
function bytesToState(bytes) {
  if (!bytes || bytes[0] !== 1) return null;
  var sum = 0; for (var i = 1; i < bytes.length - 1; i++) sum = (sum + bytes[i]) & 255;
  if (sum !== bytes[bytes.length - 1]) return null;
  var e = initEngine(), score, runde;
  for (var j = 0; j < 5; j++) {
    e.skills[TIDS[j]] = bytes[1 + j] / 100;
    e.diffs[TIDS[j]] = Math.max(1, Math.min(5, bytes[6 + j]));
    e.streaksWin[TIDS[j]] = bytes[11 + j];
    e.lastSeen[TIDS[j]] = bytes[16 + j];
  }
  e.runde = (bytes[21] << 8) | bytes[22];
  score = (bytes[23] << 8) | bytes[24];
  return { engine: e, score: score };
}
function bytesToCode(b) { var s = ""; for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]); return btoa(s); }
function codeToBytes(code) {
  try {
    var t = (code || "").replace(/\s+/g, "");
    var h = t.lastIndexOf("#");
    if (h >= 0) t = t.slice(h + 1);
    var q = t.indexOf("?"); if (q >= 0) t = t.slice(0, q);
    var s = atob(t); var r = []; for (var i = 0; i < s.length; i++) r.push(s.charCodeAt(i));
    return r.length >= 25 ? r : null;
  } catch (e) { return null; }
}
function ladeAusHash() {
  try {
    var hash = location.hash;
    if (!hash || hash.length < 2) return false;
    var res = bytesToState(codeToBytes(hash.substring(1)));
    if (!res) return false;
    engine = res.engine; score = res.score;
    history.replaceState(null, "", location.pathname + location.search);
    return true;
  } catch (e) { return false; }
}
function shareLink() {
  var base = location.href.split("#")[0];
  return base + "#" + bytesToCode(stateToBytes(engine, score));
}

/* ============================================================
   SCORM 1.2-Wrapper (Moodle/LMS); no-op wenn kein LMS
   ============================================================ */
var scormAPI = null;
(function () {
  try {
    var w = window;
    while (w.parent && w.parent !== w) { if (w.parent.API) { scormAPI = w.parent.API; return; } w = w.parent; }
    if (window.opener && window.opener.API) scormAPI = window.opener.API;
  } catch (e) {}
})();
var lmsAktiv = false;
function lmsInit() {
  if (!scormAPI) return;
  lmsAktiv = scormAPI.LMSInitialize("") === "true";
  if (!lmsAktiv) return;
  var sd = scormAPI.LMSGetValue("cmi.suspend_data");
  var res = (sd && codeToBytes(sd)) ? bytesToState(codeToBytes(sd)) : null;
  if (!window._hashGeladen) {
    var lokaler = ladeLokal();
    var lokalRes = (lokaler && codeToBytes(lokaler)) ? bytesToState(codeToBytes(lokaler)) : null;
    var quelle = res || lokalRes;
    if (quelle) { engine = quelle.engine; score = quelle.score; }
  }
  scormAPI.LMSSetValue("cmi.core.lesson_status", "incomplete");
  scormAPI.LMSCommit("");
}
function lmsSync() {
  if (!lmsAktiv || !scormAPI) return;
  var pct = engine.runde > 0 ? Math.round(score / engine.runde * 100) : 0;
  scormAPI.LMSSetValue("cmi.core.score.raw", pct);
  scormAPI.LMSSetValue("cmi.core.score.min", "0");
  scormAPI.LMSSetValue("cmi.core.score.max", "100");
  scormAPI.LMSSetValue("cmi.core.lesson_status", engine.runde >= 10 ? "completed" : "incomplete");
  scormAPI.LMSSetValue("cmi.suspend_data", bytesToCode(stateToBytes(engine, score)));
  scormAPI.LMSCommit("");
}
function lmsFinish() { if (lmsAktiv && scormAPI) { try { scormAPI.LMSFinish(""); } catch (e) {} } }
window.addEventListener("beforeunload", lmsFinish);

/* ============================================================
   App-Logik + UI
   ============================================================ */
var engine = initEngine(), score = 0, modus = "mc", aufgabe, ergebnis = null, auswahl = null, startZeit = 0, panelOffen = false;

function ladeLokal() { try { return localStorage.getItem(SPEICHER_KEY); } catch (e) { return null; } }
function speichere() {
  try { localStorage.setItem(SPEICHER_KEY, bytesToCode(stateToBytes(engine, score))); return true; } catch (e) { return false; }
}
function ladeLokalInState() {
  var c = ladeLokal();
  if (!c) return;
  var res = bytesToState(codeToBytes(c));
  if (res) { engine = res.engine; score = res.score; }
}
function neueAufgabe() {
  var tid = waehleThema(engine);
  aufgabe = makeAufgabe(tid, engine.diffs[tid]);
  ergebnis = null; auswahl = null;
  startZeit = Date.now();
  render();
}
function beantworten(wert) {
  if (ergebnis !== null) return;
  var richtig = Number(wert) === aufgabe.antwort;
  auswahl = wert; ergebnis = richtig;
  if (richtig) score++;
  feedback(engine, aufgabe.themaId, richtig, (Date.now() - startZeit) / 1000);
  speichere(); lmsSync();
  render();
}
function weiter() { neueAufgabe(); }
function setModus(m) { modus = m; render(); }
function zuruecksetzen() {
  try { localStorage.removeItem(SPEICHER_KEY); } catch (e) {}
  engine = initEngine(); score = 0;
  if (lmsAktiv && scormAPI) { scormAPI.LMSSetValue("cmi.suspend_data", ""); scormAPI.LMSCommit(""); }
  neueAufgabe(); renderStatus();
}
function togglePanel() { panelOffen = !panelOffen; renderPanel(); }
function codeKopieren() {
  var ta = document.getElementById("exportCode");
  ta.select();
  try { document.execCommand("copy"); if (navigator.clipboard) navigator.clipboard.writeText(ta.value); } catch (e) {}
}
function codeLaden() {
  var res = bytesToState(codeToBytes(document.getElementById("importCode").value));
  var msg = document.getElementById("importMsg");
  if (!res) { msg.className = "msg no"; msg.textContent = "❌ Ungültiger Code – bitte vollständig kopieren."; return; }
  engine = res.engine; score = res.score;
  speichere(); lmsSync();
  msg.className = "msg ok"; msg.textContent = "✅ Spielstand übernommen!";
  neueAufgabe(); renderStatus();
}
function renderStatus() {
  document.getElementById("scoreEl").textContent = score;
  document.getElementById("rundeEl").textContent = "Punkte · Runde " + engine.runde;
}
function renderSkills() {
  var html = "";
  THEMEN.forEach(function (t) {
    var p = engine.skills[t.id];
    var farbe = p > 0.7 ? "#10b981" : p > 0.4 ? "#fbbf24" : "#fb7185";
    html += '<div class="skill"><div class="name">' + t.name + '</div><div class="bar"><div style="width:' +
      (p * 100) + '%;background:' + farbe + '"></div></div><div class="st">St. ' + engine.diffs[t.id] + "</div></div>";
  });
  document.getElementById("skills").innerHTML = html;
  document.getElementById("analyseEl").innerHTML = "<b>🤖 Trainer-Analyse:</b> " + tippFuer(engine);
}
function renderAufgabe() {
  var thema = THEMEN.filter(function (t) { return t.id === aufgabe.themaId; })[0];
  document.getElementById("themaBadge").textContent = thema.name.toUpperCase();
  document.getElementById("frageEl").textContent = aufgabe.frage + " = ?";
  document.getElementById("tabMC").className = modus === "mc" ? "aktiv" : "";
  document.getElementById("tabIN").className = modus === "input" ? "aktiv" : "";
  var box = document.getElementById("antwortBox"), html = "";
  if (modus === "mc") {
    var opt = [aufgabe.antwort].concat(aufgabe.distr);
    // Sollte immer 4 Optionen ergeben (1 richtige + 3 Distraktoren)
    // Falls nicht, mit nahen Werten auffüllen
    for (var delta = 1; opt.length < 4 && delta < 50; delta++) {
      [aufgabe.antwort + delta, aufgabe.antwort - delta].forEach(function (v) {
        if (opt.length < 4 && v >= 0 && opt.indexOf(v) === -1) opt.push(v);
      });
    }
    opt.sort(function () { return Math.random() - 0.5; });
    opt.forEach(function (o) {
      var cls = "";
      if (ergebnis !== null) {
        if (o === aufgabe.antwort) cls = "richtig";
        else if (o === Number(auswahl)) cls = "falsch";
        else cls = "gedimmt";
      }
      html += '<button class="' + cls + '" ' + (ergebnis !== null ? "disabled" : "onclick=\"beantworten(" + o + ')"') + ">" + o + "</button>";
    });
    box.className = "mc"; box.innerHTML = html;
  } else {
    html = '<input id="eingabeIn" type="number" inputmode="numeric" placeholder="?" ' +
      (ergebnis !== null ? 'value="' + auswahl + '" disabled' : "") +
      ' onkeydown="if(event.key===\'Enter\')beantworten(this.value)">' +
      '<button ' + (ergebnis !== null ? "disabled" : 'onclick="beantworten(document.getElementById(\'eingabeIn\').value)"') + ">OK</button>";
    box.className = "eingabe"; box.innerHTML = html;
    if (ergebnis === null) { var inp = document.getElementById("eingabeIn"); if (inp) inp.focus(); }
  }
  var fb = document.getElementById("feedbackBox");
  if (ergebnis !== null) {
    fb.innerHTML = '<div class="feedback ' + (ergebnis ? "ok" : "no") + '">' +
      (ergebnis ? "✅ Richtig! Schwierigkeit steigt, sobald du 2x in Folge richtig bist."
                : "❌ Leider falsch. Richtig ist " + aufgabe.antwort + ". Wir üben das weiter.") +
      '</div><button class="weiter" onclick="weiter()">Nächste Aufgabe →</button>';
  } else fb.innerHTML = "";
}
function renderPanel() {
  document.getElementById("panelBody").className = panelOffen ? "panel-body offen" : "panel-body";
  document.getElementById("panelPfeil").textContent = panelOffen ? "▾" : "▸";
  if (!panelOffen) return;
  var code = bytesToCode(stateToBytes(engine, score));
  var link = shareLink();
  document.getElementById("exportCode").value = link;
  var linkBytes = [];
  for (var li = 0; li < link.length; li++) linkBytes.push(link.charCodeAt(li));
  var m = qrMake(linkBytes), svg = "";
  if (m) {
    var n = m.length + 8, rects = "";
    for (var y = 0; y < m.length; y++) for (var x = 0; x < m.length; x++)
      if (m[y][x]) rects += '<rect x="' + (x + 4) + '" y="' + (y + 4) + '" width="1" height="1" fill="black"/>';
    svg = '<svg viewBox="0 0 ' + n + " " + n + '" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/>' + rects + "</svg>";
  } else svg = "<p>Zu groß.</p>";
  document.getElementById("qr").innerHTML = svg;
}
function render() { renderStatus(); renderSkills(); renderAufgabe(); if (panelOffen) renderPanel(); }

// Kürzel Strg+S
document.addEventListener("keydown", function (e) {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); speichere(); renderStatus(); }
});

// Start: QR-Hash (falls gescannt) > LMS (falls vorhanden) > localStorage > frisch
(function start() {
  window._hashGeladen = ladeAusHash();
  if (window._hashGeladen) { speichere(); lmsSync(); }
  else if (scormAPI) { lmsInit(); }
  else { ladeLokalInState(); }
  neueAufgabe();
})();
</script>
</body>
